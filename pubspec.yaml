name: lianji
description: 练迹 · 离线训练日志
publish_to: none
version: 0.2.12+14
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.2.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  fl_chart: ^1.0.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  http: ^1.5.0
  flutter_secure_storage: 11.2.0
  file_picker: 13.1.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  workmanager: ^0.9.0+3
  xml: ^6.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  shaders:
    - assets/shaders/liquid_glass.frag
  assets:
    - assets/translations/
    - assets/images/home-hero-jade.png
    - assets/icons/arm-flex.png
    - assets/licenses/mdi.txt
    - assets/icons/recent-dumbbell.png
    - assets/licenses/fontawesome.txt
